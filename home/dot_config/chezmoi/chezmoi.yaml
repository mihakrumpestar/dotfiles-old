merge:
  command: codium
  args: ["--wait", "--diff", "{{ .Destination }}", "{{ .Source }}"]

diff:
  command: "meld"
  args: ["--diff", "{{ .Destination }}", "{{ .Target }}"]
  exclude: ["scripts"]

keepassxc:
  database: "~/Documents/digital-identity/KeePass.kdbx"
  openOrgs: ["--no-password", "--yubikey", "1"]
  mode: "open"
  #prompt: false
# keepassxc-cli open --no-password --yubikey 1 <path>
